---
layout: default
---
<article class="post">
  <a href="/blog" class="post-back">← B-Logs</a>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date">{{ page.date | date: "%B %d, %Y" }}</time>
  </header>

  <hr>

  <div class="post-body">
    {{ content }}
  </div>

  <hr>

  <p><a href="/blog">← Back to B-Logs</a></p>
</article>
