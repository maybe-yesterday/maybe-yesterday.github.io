<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  {% if page.mathjax %}
    {% include mathjax.html %}
  {% endif %}
  <!-- Anti-flash: apply saved theme before paint -->
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* ── Color variables ── */
    :root {
      --bg:         #ffffff;
      --text:       #2d2d2d;
      --text-muted: #666;
      --link:       #0066cc;
      --link-hover: #0044aa;
      --border:     #e8e8e8;
      --card-bg:    #f7f7f7;
      --code-bg:    #f4f4f4;
      --shadow:     0 1px 4px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] {
      --bg:         #1a1a1a;
      --text:       #e0e0e0;
      --text-muted: #999;
      --link:       #66b2ff;
      --link-hover: #99ccff;
      --border:     #2e2e2e;
      --card-bg:    #242424;
      --code-bg:    #2a2a2a;
      --shadow:     0 1px 4px rgba(0,0,0,0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:         #1a1a1a;
        --text:       #e0e0e0;
        --text-muted: #999;
        --link:       #66b2ff;
        --link-hover: #99ccff;
        --border:     #2e2e2e;
        --card-bg:    #242424;
        --code-bg:    #2a2a2a;
        --shadow:     0 1px 4px rgba(0,0,0,0.35);
      }
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      padding: 0;
      transition: background 0.2s, color 0.2s;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }
    p { margin: 0 0 1rem; }
    h1, h2, h3, h4 { line-height: 1.3; margin: 0 0 0.75rem; }
    img { max-width: 100%; height: auto; border-radius: 6px; }
    code {
      background: var(--code-bg);
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.88em;
    }
    pre code { padding: 0; background: none; }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    blockquote {
      border-left: 3px solid var(--border);
      margin: 1rem 0;
      padding: 0.25rem 1rem;
      color: var(--text-muted);
    }

    /* ── Layout ── */
    .container { max-width: 820px; margin: 0 auto; padding: 0 1.5rem; }

    /* ── Sticky header ── */
    .site-header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .site-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.8rem;
      padding-bottom: 0.8rem;
    }
    .site-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .site-title:hover { text-decoration: none; color: var(--link); }

    .site-nav { display: flex; align-items: center; gap: 1.5rem; }
    .site-nav a {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .site-nav a:hover { color: var(--link); text-decoration: none; }
    .site-nav a.active { color: var(--text); }

    #theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.55rem;
      color: var(--text);
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    #theme-toggle:hover { border-color: var(--link); }

    /* ── Page content ── */
    .page-content { padding: 2.5rem 0 5rem; }

    /* ── Post layout ── */
    .post { max-width: 680px; }
    .post-back {
      display: inline-block;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
    .post-back:hover { color: var(--link); text-decoration: none; }
    .post-header { margin-bottom: 0.5rem; }
    .post-title { font-size: 1.9rem; font-weight: 700; margin-bottom: 0.3rem; letter-spacing: -0.02em; }
    .post-date { color: var(--text-muted); font-size: 0.88rem; display: block; margin-bottom: 1.5rem; }
    .post-body { font-size: 1.02rem; }
    .post-body p, .post-body li { line-height: 1.85; }
    .post-body h2 { margin-top: 2rem; }
    .post-body h3 { margin-top: 1.5rem; }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .site-footer a { color: var(--text-muted); }
    .site-footer a:hover { color: var(--link); }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .site-nav { gap: 0.9rem; }
      .site-nav a { font-size: 0.82rem; }
      .page-content { padding: 1.5rem 0 3rem; }
      .post-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="/" class="site-title">maybe-yesterday</a>
      <nav class="site-nav">
        <a href="/"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
        <a href="/blog"{% if page.url contains "/blog" or page.url contains "/posts/" %} class="active"{% endif %}>B-Logs</a>
        <a href="/projects"{% if page.url contains "/projects" %} class="active"{% endif %}>Projects</a>
        <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
      </nav>
    </div>
  </header>

  <div class="container">
    <main class="page-content">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="container">
      <a href="https://github.com/maybe-yesterday" target="_blank" rel="noopener">github/maybe-yesterday</a>
      &nbsp;·&nbsp;
      made with ✨ (and too much caffeine)
    </div>
  </footer>

  <script src="/assets/js/nyan-click.js"></script>
  <script>
    function toggleTheme() {
      var cur = document.documentElement.getAttribute('data-theme');
      var isDark = cur === 'dark' ||
        (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      syncToggleBtn();
    }
    function syncToggleBtn() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var cur = document.documentElement.getAttribute('data-theme');
      var isDark = cur === 'dark' ||
        (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
      btn.textContent = isDark ? '☀️' : '🌙';
    }
    syncToggleBtn();
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', syncToggleBtn);
  </script>

</body>
</html>
